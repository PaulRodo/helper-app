<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Научпоп-поиск</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #e3ebf6; --bg2: #d9ede8;
  --card: #ffffff; --text: #151a2d; --hint: #7c829a; --line: #eaecf4; --soft: #eef0f8;
  --primary: #6f55e6; --primary2: #a05fb8;
  --shadow: 0 6px 24px rgba(40, 52, 100, .08);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg1: #141824; --bg2: #112021;
  --card: #1d2233; --text: #eef0fa; --hint: #98a0bb; --line: #2a3048; --soft: #262c42;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { color: var(--text); font: 500 15px/1.45 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(135deg, var(--bg1), var(--bg2)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 48px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.cap1 { color: var(--hint); font-size: 13px; font-weight: 600; }
h1 { margin: 2px 0 0; font-size: 27px; font-weight: 800; letter-spacing: -.01em; }
.round { width: 42px; height: 42px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font-size: 18px; }

.searchbox { display: flex; gap: 8px; background: var(--card); border-radius: 22px; padding: 6px 6px 6px 18px; box-shadow: var(--shadow); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; font-weight: 600; }
.searchbox input::placeholder { color: var(--hint); font-weight: 500; }
.go { background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; font-weight: 700; border-radius: 17px; padding: 0 20px; min-height: 44px; }
.enrow { display: flex; align-items: center; gap: 10px; margin: 10px 6px 0; font-size: 13px; color: var(--hint); font-weight: 600; }
.enrow input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--hint); background: none; padding: 4px 0; font-size: 16px; font-weight: 600; color: var(--text); outline: none; }

.seg { display: flex; gap: 2px; margin-top: 14px; background: var(--soft); padding: 4px; border-radius: 16px; }
.seg button { flex: 1; padding: 9px 0; border-radius: 12px; color: var(--hint); font-weight: 700; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 2px 8px rgba(40, 52, 100, .12); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 2px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 13px; border-radius: 999px; background: var(--card); color: var(--hint); font-weight: 600; font-size: 14px; box-shadow: 0 1px 4px rgba(40, 52, 100, .06); }
.chip.on { background: color-mix(in srgb, var(--primary) 16%, var(--card)); color: var(--primary); font-weight: 700; }
.chip.lock { border: 1px dashed var(--hint); box-shadow: none; background: transparent; }
.chip.tog { border: 1px solid var(--line); }

.card { background: var(--card); border-radius: 26px; padding: 18px; margin-top: 14px; box-shadow: var(--shadow); }
.card.tint { background: linear-gradient(160deg, color-mix(in srgb, var(--t) 18%, var(--card)), var(--card) 62%); }
.card.grad { background: linear-gradient(135deg, #6f55e6 0%, #b05fa0 55%, #ef6a3c 100%); color: #fff; }
.card.green { background: linear-gradient(135deg, #25b05f, #0f8a45); color: #fff; }
.sh { display: flex; align-items: center; gap: 10px; }
.sh h2 { margin: 0; font-size: 16px; font-weight: 700; }
.ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--t, #6b7280); color: #fff; font-size: 15px; flex: none; }
.grad .ico { background: rgba(255, 255, 255, .22); }
.gp { margin: 8px 0 12px; font-size: 14px; opacity: .92; }
.sitechips { display: flex; flex-wrap: wrap; gap: 6px; }
.sc { padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .2); color: #fff; font-weight: 600; font-size: 13px; }
.sc.on { background: #fff; color: #4a3bb0; font-weight: 700; }
.bigbtn { display: block; text-align: center; margin-top: 14px; padding: 13px; border-radius: 16px; background: #fff; color: #4a3bb0; font-weight: 800; }

.note, .spin { color: var(--hint); padding: 18px 2px; text-align: center; }
.spin.white, .note.white { color: #fff; }
.err { color: var(--hint); font-size: 14px; margin: 10px 0 0; }
.tip h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.tip p { margin: 0; font-size: 14px; opacity: .92; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.recent button { background: var(--card); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; box-shadow: 0 1px 4px rgba(40, 52, 100, .06); }

.item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.body .item:first-child { border-top: 0; padding-top: 6px; }
.item img { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex: none; background: var(--soft); }
.ib { min-width: 0; }
.ib b { display: block; font-weight: 700; line-height: 1.3; }
.ib p { margin: 3px 0 0; color: var(--hint); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 7px; }
.pill { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--hint); }
.pill.g { background: rgba(30, 166, 90, .16); color: #1a9a52; }
.pill.b { background: rgba(42, 116, 192, .16); color: #2a74c0; }
.pill.t { background: rgba(14, 143, 128, .16); color: #0e8f80; }
.src { font-size: 12px; color: var(--hint); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.m { position: relative; aspect-ratio: 4/3; border-radius: 20px; overflow: hidden; background: var(--soft); padding: 0; box-shadow: var(--shadow); }
.m img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; font-size: 12px; line-height: 1.25; font-weight: 600; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.m .lic { position: absolute; top: 8px; left: 8px; padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: #151a2d; font-size: 11px; font-weight: 800; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .play { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px; display: grid; place-items: center; font-style: normal; }

.links { color: var(--hint); font-size: 14px; font-weight: 600; }
.links a { color: var(--primary); margin-right: 14px; white-space: nowrap; font-weight: 700; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 20, .92); display: none; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.overlay.open { display: flex; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.stage img, .stage video { max-width: 100%; max-height: 100%; border-radius: 16px; }
.stage iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 16px; }
.cap { color: #fff; padding: 12px 2px 10px; font-size: 14px; font-weight: 600; }
.cap small { display: block; opacity: .65; margin-top: 2px; font-weight: 500; }
.acts { display: flex; gap: 8px; }
.acts a, .acts button { flex: 1; text-align: center; padding: 12px 6px; border-radius: 16px; font-weight: 700; font-size: 14px; background: rgba(255, 255, 255, .16); color: #fff; }
.acts a { background: linear-gradient(135deg, var(--primary), var(--primary2)); }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 24, .5); display: none; align-items: flex-end; }
.sheet.open { display: flex; }
.panel { width: 100%; max-width: 720px; margin: 0 auto; max-height: 90vh; overflow: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.panel h3 { margin: 0 0 2px; font-size: 20px; font-weight: 800; }
.panel label { display: block; margin-top: 16px; font-weight: 700; }
.panel input, .panel select, .panel textarea { width: 100%; margin-top: 6px; padding: 11px 13px; border-radius: 14px; border: 0; background: var(--soft); font-size: 16px; font-weight: 500; }
.panel textarea { min-height: 150px; resize: vertical; font-size: 14px; line-height: 1.5; }
.panel .help { color: var(--hint); font-size: 13px; margin-top: 5px; font-weight: 500; }
.panel .help a { color: var(--primary); font-weight: 700; }
.panel .save { width: 100%; margin-top: 20px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--primary2)); color: #fff; font-weight: 800; }
.panel .reset { margin-top: 8px; color: var(--primary); font-weight: 700; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); background: #151a2d; color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
.item.row{position:relative}.ia{display:flex;gap:12px;flex:1;min-width:0;padding-right:34px}
.star{position:absolute;top:10px;right:0;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--hint);z-index:2}
.star.on{color:#f5a623}.m .star{top:auto;bottom:6px;right:6px;background:rgba(0,0,0,.45);color:#fff}.m .star.on{color:#ffc94d}
.m span{padding-right:44px}.m{cursor:pointer}
.pill.r{background:rgba(216,59,59,.16);color:#d83b3b}
.lbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.lbar button{padding:8px 14px;border-radius:14px;background:var(--soft);font-weight:700;font-size:13px}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow input{flex:1;min-width:0;padding:10px 13px;border-radius:14px;border:0;background:var(--soft);font-size:16px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:700;margin-top:8px}
.sl{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:13px}
.seg button{font-size:14px}
.pill.o{background:rgba(217,119,6,.16);color:#b45309}
.pill.w{background:rgba(120,113,108,.18);color:#78716c}
.pill.j{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:1px solid var(--line)}
.ib p.sum{display:block;overflow:visible;color:var(--text);border-left:3px solid var(--primary);padding-left:9px;margin-top:7px}
.ta{width:100%;min-height:190px;margin-top:12px;padding:12px 14px;border-radius:16px;border:0;background:var(--soft);font-size:15px;line-height:1.5;resize:vertical}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hs .m{flex:none;width:156px;box-shadow:none}
.scr{white-space:pre-wrap;line-height:1.75;margin-top:12px}
.lbar .go{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:0 18px;min-height:44px}
.mk{background:none;border-radius:5px;padding:1px 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:inherit}
.mk.wait{border-bottom:2px dotted var(--hint)}
.mk.ok{background:rgba(30,166,90,.22)}
.mk.part{background:rgba(245,166,35,.28)}
.mk.contra{background:rgba(139,92,246,.22)}
.mk.none{background:rgba(216,59,59,.16);border-bottom:2px solid #d83b3b}
.mk.op{border-bottom:1px dashed var(--hint)}
.cl{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.cl:first-child{border-top:0;margin-top:0;padding-top:0}
.cl.flash{animation:fl 1.2s}
@keyframes fl{from{background:color-mix(in srgb,var(--primary) 18%,transparent)}to{background:transparent}}
.clh{display:flex;gap:8px;align-items:flex-start}
.clh .pill{flex:none;margin-top:2px}
.clh b{font-weight:700;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.org{padding:10px 0;border-top:1px solid var(--line)}
.org:first-child{border-top:0}
.orgh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.org p{margin:4px 0;font-size:14px}
.org a{color:var(--primary);font-weight:700;font-size:13px}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.subrow button{color:var(--hint);padding:4px 10px}
@media (prefers-reduced-motion:reduce){.cl.flash{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="cap1">Научпоп-поиск</div>
      <h1>Что ищем?</h1>
    </div>
    <div style="display:flex;gap:8px"><button class="round" id="libbtn" type="button" aria-label="Моё">⭐</button><button class="round" id="gear" type="button" aria-label="Настройки">⚙️</button></div>
  </div>

  <form id="form" class="searchbox" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="Например: как работает вакцина" aria-label="Запрос">
    <button class="go" type="submit">Найти</button>
  </form>
  <form id="enform" class="enrow" autocomplete="off" hidden>
    <label for="qen">На английском</label>
    <input id="qen" type="text" enterkeyhint="search" autocapitalize="off" spellcheck="false">
  </form>

  <div class="seg" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="info" aria-selected="true">Статьи</button>
    <button type="button" role="tab" data-tab="image" aria-selected="false">Картинки</button>
    <button type="button" role="tab" data-tab="video" aria-selected="false">Видео</button>
    <button type="button" role="tab" data-tab="script" aria-selected="false">Сценарий</button>
  </div>
  <div class="chips" id="chips"></div>

  <main id="results"></main>
</div>

<div class="overlay" id="viewer" role="dialog" aria-modal="true">
  <div class="stage" id="stage"></div>
  <div class="cap" id="cap"></div>
  <div class="acts">
    <a id="src" data-ext href="#">Источник</a>
    <button type="button" id="vcopy">Копировать</button>
    <button type="button" id="vclose">Закрыть</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>Настройки</h3>
    <div class="help">Ключи хранятся только на этом устройстве.</div>
    <label>Язык Википедии
      <select id="lang">
        <option value="ru">Русский</option><option value="en">English</option>
        <option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option>
      </select>
    </label>
    <label>Адрес Worker (умный поиск, перевод, сценарий)
      <input id="k-worker" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://nauchpop-api.имя.workers.dev">
      <div class="help">Инструкция по запуску в README.</div>
    </label>
    <label>Токен доступа (нужен, только если открываешь апп вне Telegram)
      <input id="k-token" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Необязательно">
    </label>
    <div style="margin-top:16px;font-weight:700">Подписки на свежие мета-анализы</div>
    <div id="subs"><div class="help">Загружаю…</div></div>
    <div class="addrow"><input id="newsub" placeholder="Тема, например: витамин D"><button class="go" id="addsub" type="button">＋</button></div>
    <div class="help">Раз в день бот пришлёт новые мета-анализы и системные обзоры. Сначала нажми Start у бота.</div>
    <label>Ключ Pexels (стоковые фото и видео)
      <input id="k-pexels" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Вставь ключ">
      <div class="help">Бесплатно: <a data-ext href="https://www.pexels.com/api/">pexels.com/api</a></div>
    </label>
    <label>Ключ Pixabay (стоковые фото и видео)
      <input id="k-pixabay" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Вставь ключ">
      <div class="help">Бесплатно: <a data-ext href="https://pixabay.com/api/docs/">pixabay.com/api/docs</a></div>
    </label>
    <label>Сайты здравоохранения
      <textarea id="sites" spellcheck="false" autocapitalize="off"></textarea>
      <div class="help">По одному в строке: домен, пробел, название.</div>
      <button type="button" class="reset" id="sites-reset">Вернуть список по умолчанию</button>
    </label>
    <button class="save" type="button" id="save">Сохранить</button>
  </div>
</div>

<div class="sheet" id="savesheet"><div class="panel"><h3>Сохранить в подборку</h3><div id="saveopts"></div><div class="addrow"><input id="newcol" placeholder="Новая подборка"><button class="go" id="addcol" type="button">＋</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const dark = tg ? tg.colorScheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.dataset.theme = dark ? 'dark' : 'light';
if (tg) { try { tg.setHeaderColor(dark ? '#141824' : '#e3ebf6'); tg.setBackgroundColor(dark ? '#141824' : '#e3ebf6'); } catch (e) {} }

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const DEFAULT_SITES = `who.int ВОЗ
ecdc.europa.eu ECDC (ЕС)
efsa.europa.eu EFSA (безопасность еды)
ema.europa.eu EMA (лекарства ЕС)
nhs.uk NHS (Великобритания)
nice.org.uk NICE (Великобритания)
cochrane.org Cochrane
nih.gov NIH (США)
medlineplus.gov MedlinePlus (США)
cdc.gov CDC (США)
fda.gov FDA (США)
mayoclinic.org Mayo Clinic
health.harvard.edu Harvard Health
canada.ca/en/public-health Public Health Canada
health.gov.au Минздрав Австралии
ourworldindata.org Our World in Data`;

const DEFAULT_WORKER = ''; // можно вписать адрес Worker сюда, тогда вводить его в настройках не придётся
let cfg = Object.assign({ pixabay: '', pexels: '', lang: 'ru', off: {}, sitesOff: {}, sites: DEFAULT_SITES, freeOnly: true, reviewsOnly: false, worker: DEFAULT_WORKER, token: '', smart: true }, store.get('cfg', {}));
let recent = store.get('recent', []);
let tab = 'info', sid = 0, current = [], ctx = { q: '', en: '', qs: [] }, vtok = 0, viewerItem = null;
let lib = store.get('lib', null) || { cols: [{ id: 'c0', n: 'Без темы' }], items: [] };
let libCol = 'all', libQuery = '', pendingKey = null;
const reg = {};
let secItems = {}, TR = store.get('tr', {}), ruOn = false, consCache = {}, scriptText = store.get('script', ''), brollKind = 'video', lastMode = '', fc = null, scenes = [], ssid = 0;

const enc = encodeURIComponent;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const strip = h => new DOMParser().parseFromString(String(h || ''), 'text/html').body.textContent || '';
const slug = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const openLink = url => (tg && tg.openLink) ? tg.openLink(url) : window.open(url, '_blank');
const parseSites = () => cfg.sites.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const p = l.split(/\s+/); return { d: p[0], n: p.slice(1).join(' ') || p[0] }; });

async function getJSON(url, headers) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 12000);
  try {
    const r = await fetch(url, { signal: c.signal, headers: headers || undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function translate(q) {
  const d = await getJSON(`https://api.mymemory.translated.net/get?q=${enc(q)}&langpair=ru%7Cen`);
  const t = d && d.responseData && d.responseData.translatedText;
  if (!t || /MYMEMORY|INVALID/i.test(t)) throw new Error('no translation');
  return strip(t);
}

};
['Clinical Trial', 'Controlled Clinical Trial', 'Pragmatic Clinical Trial', 'Equivalence Trial', 'Clinical Trial, Phase I', 'Clinical Trial, Phase II', 'Clinical Trial, Phase III', 'Clinical Trial, Phase IV']
  .forEach(k => { EV[k] = ['🧪 Клин. испытание', 'b', 2, 'Испытание на людях без полной рандомизации или с ранней фазой']; });
const MESH_OBS = /^(Cohort Studies|Case-Control Studies|Cross-Sectional Studies|Longitudinal Studies|Prospective Studies|Retrospective Studies|Follow-Up Studies|Observational Study)$/i;

function evidence(types, mesh) {
  mesh = mesh || [];
  const seen = {}, badges = [];
  let rank = 5;
  const add = k => { const e = EV[k]; if (e && !seen[e[0]]) { seen[e[0]] = 1; badges.push([e[0], e[1], e[3]]); rank = Math.min(rank, e[2]); } };
  (types || []).forEach(add);
  if (mesh.some(m => MESH_OBS.test(m))) add('Observational Study');
  const human = mesh.includes('Humans');
  if (mesh.includes('Animals') && !human) { badges.push(['🐭 Животные', 'w', 'Исследование на животных: на людей напрямую не переносится']); rank = 4; }
  if (mesh.includes('In Vitro Techniques') && !human) { badges.push(['🧫 In vitro', 'w', 'Опыт в пробирке или на клетках']); rank = 4; }
  return { badges, rank };
}

// Аннотации, типы публикации и MeSH-термины из PubMed (нужны для значков надёжности и пересказа)
async function efetch(ids) {
  const xml = new DOMParser().parseFromString(await getText(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&retmode=xml&id=${ids.join(',')}`), 'text/xml');
  const out = {};
  xml.querySelectorAll('PubmedArticle').forEach(a => {
    const node = a.querySelector('MedlineCitation > PMID');
    if (!node) return;
    out[node.textContent] = {
      abs: [...a.querySelectorAll('Abstract > AbstractText')].map(n => { const l = n.getAttribute('Label'); return (l ? l + ': ' : '') + n.textContent; }).join(' '),
      pts: [...a.querySelectorAll('PublicationType')].map(n => n.textContent),
      mesh: [...a.querySelectorAll('MeshHeading > DescriptorName')].map(n => n.textContent)
    };
  });
  return out;
}

async function epmc(query, n) {
  const d = await getJSON(`https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${enc(query)}&format=json&pageSize=${n}&resultType=core`);
  return ((d.resultList && d.resultList.result) || []).map(r => {
    const pts = (r.pubTypeList && r.pubTypeList.pubType) || [];
    const mesh = ((r.meshHeadingList && r.meshHeadingList.meshHeading) || []).map(m => m.descriptorName);
    const ev = evidence(pts, mesh);
    return { title: strip(r.title), text: r.citedByCount ? 'цитирований: ' + r.citedByCount : '', abs: strip(r.abstractText), badges: ev.badges, rank: ev.rank, journal: r.journalTitle || '', year: r.pubYear, url: `https://europepmc.org/article/${r.source}/${r.id}`, meta: 'europepmc.org' };
  });
}

async function wikiEn(q, n) {
  const d = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q)}&gsrlimit=${n}&prop=extracts&exintro=1&explaintext=1&exsentences=4&format=json&origin=*`);
  return Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).map(p => ({
    title: p.title, text: p.extract, abs: p.extract, badges: [['📖 Энциклопедия', '', 'Википедия: не первичный источник']], rank: 6, url: `https://en.wikipedia.org/?curid=${p.pageid}`, meta: 'en.wikipedia.org'
  }));
}

const commons = (en, filter, type) => getJSON(
  `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${enc(en + ' ' + filter)}&gsrlimit=40&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=500&format=json&origin=*`
).then(d => Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).map(p => {
  const i = (p.imageinfo || [])[0] || {};
  const lic = (i.extmetadata && i.extmetadata.LicenseShortName && i.extmetadata.LicenseShortName.value) || '';
  return { type, thumb: i.thumburl || i.url, full: i.url, title: p.title.replace(/^File:/, '').replace(/\.\w+$/, ''), page: i.descriptionurl, meta: 'Wikimedia Commons', lic };
}).filter(x => x.thumb && (!cfg.freeOnly || /public domain|cc0|^pd/i.test(x.lic))));

const nasa = (en, mt) => getJSON(`https://images-api.nasa.gov/search?q=${enc(en)}&media_type=${mt}&page_size=24`)
  .then(d => d.collection.items.map(i => {
    const m = (i.data || [])[0] || {};
    const th = i.links && i.links[0] && i.links[0].href ? i.links[0].href.replace('http://', 'https://') : '';
    return { type: mt, thumb: th, full: mt === 'image' ? th.replace('~thumb.', '~medium.') : '', asset: mt === 'video' ? i.href : '', title: m.title, page: `https://images.nasa.gov/details/${m.nasa_id}`, meta: 'NASA', lic: 'NASA' };
  }).filter(x => x.thumb));

async function resolveVideo(it) {
  const files = await getJSON(it.asset);
  const mp4 = files.filter(u => /\.mp4$/i.test(u)).map(u => u.replace('http://', 'https://'));
  return mp4.find(u => /~medium/.test(u)) || mp4.find(u => /~small/.test(u)) || mp4.find(u => /~mobile/.test(u)) || mp4[0];
}

function saveLib() {
  store.set('lib', lib);
  const cs = tg && tg.CloudStorage; if (!cs) return;
  try { const j = JSON.stringify(lib), n = Math.ceil(j.length / 3500);
    for (let i = 0; i < n; i++) cs.setItem('lib' + i, j.slice(i * 3500, (i + 1) * 3500));
    cs.setItem('libn', String(n)); } catch (e) {}
}
function restoreLib() {
  const cs = tg && tg.CloudStorage;
  if (store.get('lib', null) || !cs) return;
  cs.getItem('libn', (e, n) => { n = +n; if (!n) return; const ks = Array.from({ length: n }, (_, i) => 'lib' + i);
    cs.getItems(ks, (e2, v) => { try { lib = JSON.parse(ks.map(k => v[k]).join('')); store.set('lib', lib); if (tab === 'lib') renderLib(); } catch (x) {} }); });
}

function exportText(fmt) {
  const its = lib.items.filter(i => libCol === 'all' || i.col === libCol);
  if (fmt === 'desc') return 'Источники:\n' + its.map(i => `• ${i.title}${i.lic ? ' (' + i.meta + ', ' + i.lic + ')' : ''} — ${i.url}`).join('\n');
  const ref = i => [i.text, i.year && `(${i.year})`, i.title, i.meta, i.lic && 'Лицензия: ' + i.lic, i.url].filter(Boolean).join('. ');
  return [['Исследования и статьи', 'info'], ['Видео', 'video'], ['Изображения', 'image']].filter(([, k]) => its.some(i => i.kind === k))
    .map(([n, k]) => n + ':\n' + its.filter(i => i.kind === k).map((i, j) => `${j + 1}. ${ref(i)}`).join('\n')).join('\n\n');

async function checkRetractions() {
  const m = i => ((i.url || '').match(/pubmed\.ncbi\.nlm\.nih\.gov\/(\d+)/) || [])[1];
  const ids = lib.items.map(m).filter(Boolean);
  if (!ids.length) return toast('Нет статей из PubMed');
  toast('Проверяю…');
  try {
    const d = await getJSON(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&retmode=json&id=${ids.join(',')}`);
    let n = 0;
    lib.items.forEach(i => { const r = d.result[m(i)]; if (r) { i.retracted = (r.pubtype || []).includes('Retracted Publication'); if (i.retracted) n++; } });
    saveLib(); renderLib(); toast(n ? 'Отозвано: ' + n : 'Отозванных нет');
  } catch (e) { toast('Не удалось проверить'); }
}
function addByUrl() {
  const u = ($('#addurl').value || '').trim();
  if (!/^https?:\/\//i.test(u)) return toast('Нужна ссылка');
  const host = new URL(u).hostname.replace(/^www\./, '');
  let t = u.split('?')[0].split('/').filter(Boolean).pop() || host;
  try { t = decodeURIComponent(t); } catch (e) {}
  t = t.replace(/-\d+$/, '').replace(/[-_]/g, ' ');
  const stock = /pexels|pixabay|mixkit|coverr/.test(host);
  if (!inLib(u)) lib.items.unshift({ k: u, url: u, title: t, meta: host, lic: stock ? host.split('.')[0].replace(/^./, c => c.toUpperCase()) : '', kind: stock || /video/.test(u) ? 'video' : 'info', col: libCol === 'all' ? lib.cols[0].id : libCol, added: Date.now() });
  saveLib(); renderLib();
}

const STANCE = { supports: ['Подтверждает', 'g'], contradicts: ['Противоречит', 'r'], related: ['По теме', ''] };

function itemHTML(it) {

    (it.year ? `<span class="pill">${esc(it.year)}</span>` : '');

}

const secHTML = items => items.length ? items.map(itemHTML).join('') : '<p class="err">Ничего не нашлось.</p>';
function repaintInfo() {
  Object.keys(secItems).forEach(k => { const b = document.querySelector(`#sec-${k} .body`); if (b) b.innerHTML = secHTML(secItems[k]); });
}
const relv = it => it.rel == null ? 1.5 : it.rel;

async function smartInfo(id) {
  const all = Object.entries(secItems).flatMap(([s, arr]) => arr.map(it => ({ it, s })));
  if (!all.length) return;
  const stat = $('#rankstat');
  if (stat) stat.textContent = '✨ Ранжирую и пересказываю…';
  try {
    const d = await api('rank', { query: ctx.q, summarize: true, items: all.map(({ it, s }, i) => ({ id: String(i), src: s, title: it.title, text: isRu(it.text) ? '' : (it.abs || it.text || '').slice(0, 800) })) });
    if (id !== sid) return;
    all.forEach(({ it }, i) => { it.rel = d.rel && d.rel[i] != null ? +d.rel[i] : null; it.sum = (d.sum && d.sum[i]) || ''; });
    Object.keys(secItems).forEach(s => {
      secItems[s] = secItems[s].map((it, i) => [it, i]).sort((a, b) => (relv(b[0]) - relv(a[0])) || (lvl(a[0]) - lvl(b[0])) || (a[1] - b[1])).map(x => x[0]);
    });
    repaintInfo();
    if (stat) stat.textContent = '';
  } catch (e) { if (id === sid && stat) stat.textContent = 'Умное ранжирование недоступно: ' + e.message; }
}
async function afterInfo(id) {
  if (cfg.smart && cfg.worker) await smartInfo(id);
  if (id !== sid) return;
  if (ruOn) { await ensureTr(id); if (id === sid) repaintInfo(); }
}

async function smartMedia(id, errs) {
  if (current.length < 2) return;
  const list = current.slice(0, 60);
  try {
    const d = await api('rank', { query: ctx.q, summarize: false, items: list.map((it, i) => ({ id: String(i), src: it.meta, title: it.title })) });
    if (id !== sid) return;
    list.forEach((it, i) => { it.rel = d.rel && d.rel[i] != null ? +d.rel[i] : 1.5; });
    current = list.map((it, i) => [it, i]).sort((a, b) => (b[0].rel - a[0].rel) || (a[1] - b[1])).map(x => x[0]).concat(current.slice(60));
    renderMedia(0, errs);
  } catch (e) {}
}

async function search(q, enOverride) {
  q = (q || '').trim();
  if (tab === 'lib') { libQuery = q; renderLib(); return; }
  if (tab === 'script' || !q) return;
  recent = [q, ...recent.filter(r => r !== q)].slice(0, 8);
  store.set('recent', recent);
  $('#q').blur();
  const id = ++sid;
  const res = $('#results');
  const smartOn = !!(cfg.smart && cfg.worker);
  res.innerHTML = `<div class="spin">${smartOn ? 'Понимаю запрос…' : 'Ищу…'}</div>`;

  const cyr = /[а-яёіїє]/i.test(q);
  const ov = (enOverride || '').trim();
  const keep = ov && (!smartOn || ov !== ctx.en || (ctx.q === q && ctx.manual));
  let en = '', qs = [], disputed = false;
  if (keep) { en = ov; qs = [ov]; }
  else if (smartOn) {
    if (ctx.q === q && ctx.tab === tab && ctx.qs && ctx.qs.length) ({ en, qs, disputed } = ctx);
    else {
      try { const s = await api('smart', { text: q, tab }); qs = (s.queries || []).filter(Boolean).slice(0, 4); en = qs[0] || ''; disputed = !!s.disputed; } catch (e) {}
    }
  }
  if (!en) {
    en = q;
    if (cyr) {
      if (ctx.q === q && ctx.en && !smartOn) en = ctx.en;
      else { try { en = await translate(q); } catch (e) { en = q; } }
    }
    qs = [en];
  }
  if (id !== sid) return;
  ctx = { q, en, qs, disputed, tab, manual: !!keep };
  $('#enform').hidden = !(cyr || smartOn);
  $('#qen').value = en;

  const srcs = SOURCES[tab].filter(s => !(s.key && !cfg[s.key]) && !cfg.off[s.id]);
  current = [];
  secItems = {};

  if (tab === 'info') {
    res.innerHTML = '<p class="err" id="rankstat"></p>' + trBar() + consHTML() + sitesHTML() +
      srcs.map(s => `<section class="card tint" style="--t:${s.t}" id="sec-${s.id}"><div class="sh"><span class="ico">${s.ico}</span><h2>${s.label}</h2></div><div class="body"><div class="spin">Загружаю…</div></div></section>`).join('') + linksBlock();
    let left = srcs.length;
    srcs.forEach(async s => {
      let html;
      try {
        const items = (await s.run(q, en)).filter(x => x.title);
        secItems[s.id] = items;
        html = secHTML(items);
      } catch (e) { html = '<p class="err">Источник не ответил. Попробуй ещё раз позже.</p>'; }
      if (id !== sid) return;
      const body = document.querySelector(`#sec-${s.id} .body`);
      if (body) body.innerHTML = html;
      if (--left === 0) afterInfo(id);
    });
    if (ctx.disputed && cfg.worker) runConsensus();
    return;
  }

  if (!srcs.length) { res.innerHTML = '<div class="card"><p class="note">Включи хотя бы один источник или добавь ключ в настройках.</p></div>' + linksBlock(); return; }
  const qlim = smartOn ? Math.min(3, ctx.qs.length) : 1;
  const runs = [];
  srcs.forEach(s => ctx.qs.slice(0, qlim).forEach(qq => runs.push([s, qq])));
  let pending = runs.length;
  const errs = [], seenK = new Set();
  runs.forEach(async ([s, qq]) => {
    try {
      const items = await s.run(q, qq);
      if (id === sid) items.forEach(it => { const k = it.page || it.full || it.embed; if (!seenK.has(k)) { seenK.add(k); current.push(it); } });
    } catch (e) { if (!errs.includes(s.label)) errs.push(s.label); }
    if (id !== sid) return;
    pending--;
    renderMedia(pending, errs);
    if (pending === 0 && smartOn) smartMedia(id, errs);
  });
}

/* ---------- Worker: умный поиск, перевод, сценарий, подписки ---------- */
async function api(path, body, method) {
  if (!cfg.worker) throw new Error('NO_WORKER');
  const h = { 'Content-Type': 'application/json' };
  if (tg && tg.initData) h['X-Init-Data'] = tg.initData;
  if (cfg.token) h['X-App-Token'] = cfg.token;
  const c = new AbortController(), t = setTimeout(() => c.abort(), 90000);
  try {
    const r = await fetch(cfg.worker.replace(/\/+$/, '') + '/api/' + path, { method: method || 'POST', headers: h, body: method === 'GET' ? undefined : JSON.stringify(body || {}), signal: c.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    return d;
  } finally { clearTimeout(t); }
}
function needWorker() { toast('Укажи адрес Worker в настройках'); openSheet(); }
const errCard = e => e && e.message === 'NO_WORKER'
  ? '<div class="card"><p class="note">Для этого нужен Worker. Укажи его адрес в настройках (⚙️).</p></div>'
  : `<div class="card"><p class="note">Не получилось: ${esc(e && e.message)}</p></div>`;
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const it = items[i++]; try { await fn(it); } catch (e) {} }
  }));
}
const isRu = s => /[а-яё]/i.test(s || '');

const trLabel = () => ruOn ? '↩ Показать оригинал' : '🌐 Перевести выдачу на русский';
const trBar = () => `<div class="lbar" style="margin:0 0 4px"><button type="button" id="trbtn" data-do="tr">${trLabel()}</button></div>`;

const CONS_STANCE = { confirms: ['Подтверждает', 'g'], refutes: ['Не подтверждает', 'r'], mixed: ['Неоднозначно', 'o'], no_position: ['Позиции нет', ''] };
function consBody() {

  const d = consCache[q];

  if (!cfg.worker) return `<p class="err" style="margin:8px 0">Откроет поиск Google по сайту каждой организации. Чтобы позиции пересказывались здесь, подключи Worker.</p><div class="links">${links}</div>`;
  return `<p class="err" style="margin:8px 0">Для спорных тем: что говорит каждая организация.</p><div class="lbar" style="margin-top:8px"><button type="button" data-do="cons">Сверить позиции</button></div><div class="links" style="margin-top:10px">${links}</div>`;

    <div class="lbar"><button type="button" class="go" data-do="fact">✅ Проверить факты</button><button type="button" class="go" data-do="broll">🎞 Подобрать b-roll</button></div>

  if (lastMode === 'fact' && fc) paintFact(); else if (lastMode === 'broll' && scenes.length) paintBroll();

const VERD = { ok: ['Подтверждено', 'g'], part: ['Частично', 'o'], contra: ['Противоречит источникам', 'r'], none: ['Нет источника', 'r'], wait: ['Ищу источники…', ''], op: ['Мнение', ''] };
const vkey = c => !c.checkable ? 'op' : !c.verdict ? 'wait' : ({ supported: 'ok', partial: 'part', contradicted: 'contra' }[c.verdict] || 'none');
function locate(text, quote) {
  const i = text.indexOf(quote);
  if (i >= 0) return [i, i + quote.length];
  try {
    const m = new RegExp(quote.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')).exec(text);
    if (m) return [m.index, m.index + m[0].length];
  } catch (e) {}
  return null;
}
function claimCard(c) {
  const k = vkey(c), v = VERD[k];
  const notes = c.notes || [];
  const shown = (c.cands || []).map((x, i) => ({ x, n: notes.find(n => n.i === i) })).filter(o => !o.n || o.n.stance !== 'unrelated');
  const body = shown.length
    ? `<div class="body">${shown.map(o => itemHTML(Object.assign({}, o.x, { stance: o.n && o.n.stance, why: o.n && o.n.why }))).join('')}</div>`
    : (k === 'wait' ? '' : `<p class="err">Подходящих источников не нашлось. <a data-ext href="${esc('https://scholar.google.com/scholar?q=' + enc(c.query_en || c.claim_en || c.quote))}" style="color:var(--primary);font-weight:700">Искать вручную ↗</a></p>`);
  return `<div class="cl" id="cl-${c.id}"><div class="clh"><span class="pill ${v[1]}">${v[0]}</span><b>${esc(c.quote)}</b></div>${body}</div>`;
}
function paintFact() {
  lastMode = 'fact';
  const out = $('#scriptout');
  if (!out || !fc) return;
  const { text, claims } = fc;
  claims.forEach(c => { c.range = locate(text, c.quote); });
  const placed = claims.filter(c => c.range).sort((a, b) => a.range[0] - b.range[0]);
  let pos = 0, h = '';
  placed.forEach(c => {
    if (c.range[0] < pos) return;
    h += esc(text.slice(pos, c.range[0])) + `<mark class="mk ${vkey(c)}" data-cl="${c.id}">${esc(text.slice(c.range[0], c.range[1]))}</mark>`;
    pos = c.range[1];
  });
  h += esc(text.slice(pos));
  const n = k => claims.filter(c => vkey(c) === k).length;
  const total = claims.filter(c => c.checkable).length;
  const order = claims.filter(c => c.checkable).sort((a, b) => (a.range ? a.range[0] : 1e9) - (b.range ? b.range[0] : 1e9));
  out.innerHTML = `<section class="card"><div class="sh"><span class="ico" style="--t:#25b05f">✅</span><h2>Проверка фактов</h2></div>
    <p class="err" style="margin:8px 0 0">Утверждений: ${total}. Подтверждено ${n('ok')}, частично ${n('part')}, противоречат ${n('contra')}, без источника ${n('none')}${n('wait') ? ', ещё ищу ' + n('wait') : ''}.</p>
    <div class="legend"><span class="pill g">Подтверждено</span><span class="pill o">Частично</span><span class="pill r">Нет источника / противоречит</span><span class="pill">Мнение</span></div>
    <div class="scr">${h}</div></section>
    <section class="card">${order.length ? order.map(claimCard).join('') : '<p class="note">Проверяемых утверждений не нашлось.</p>'}<p class="err">Вердикт строится по аннотациям, а не по полным текстам. Перед публикацией открой источник.</p></section>`;
}
function jumpClaim(id) {
  const el = document.getElementById('cl-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
async function findSupport(c) {
  const q = c.query_en || c.claim_en, out = [], jobs = [];
  if (c.domain !== 'other') jobs.push(epmc(`(${q}) AND SRC:MED`, 4).then(r => out.push(...r)).catch(() => {}));
  jobs.push(wikiEn(q, c.domain === 'other' ? 3 : 1).then(r => out.push(...r)).catch(() => {}));
  await Promise.all(jobs);
  return out;
}
async function runFact() {
  if (!cfg.worker) return needWorker();
  const text = scriptText.trim();
  if (text.length < 40) return toast('Вставь текст сценария');
  const out = $('#scriptout'), my = ++ssid;
  out.innerHTML = '<div class="spin">Выделяю утверждения…</div>';
  let claims;
  try { claims = ((await api('claims', { script: text.slice(0, 12000) })).claims || []).filter(c => c.quote).slice(0, 20); }
  catch (e) { if (my === ssid) out.innerHTML = errCard(e); return; }
  if (my !== ssid) return;
  fc = { text: text.slice(0, 12000), claims };
  paintFact();
  await pool(claims.filter(c => c.checkable), 4, async c => {
    c.cands = await findSupport(c);
    if (my !== ssid) return;
    if (!c.cands.length) c.verdict = 'none';
    paintFact();
  });
  if (my !== ssid) return;
  const items = claims.filter(c => c.checkable && c.cands && c.cands.length).map(c => ({
    id: c.id, claim: c.claim_en || c.quote,
    cands: c.cands.map((x, i) => ({ i, title: x.title, text: (x.abs || x.text || '').slice(0, 650), kind: (x.badges || []).map(b => b[0]).join(', ') }))
  }));
  if (items.length) {
    try {
      const v = (await api('verify', { items })).res || {};
      if (my !== ssid) return;
      claims.forEach(c => { const r = v[c.id]; if (r) { c.verdict = r.verdict; c.notes = r.notes || []; } });
    } catch (e) { toast('Не удалось оценить источники'); }
  }
  claims.forEach(c => { if (c.checkable && !c.verdict) c.verdict = 'none'; });
  paintFact();
}

/* ---------- b-roll по сценам ---------- */
const thumbHTML = (it, i, sc) => `<div class="m" ${sc != null ? `data-sc="${sc}" ` : ''}data-i="${i}"><img loading="lazy" src="${safe(it.thumb)}" alt="">${it.lic ? `<b class="lic">${esc(it.lic)}</b>` : ''}${it.type !== 'image' ? '<i class="play">▶</i>' : ''}<span>${esc(it.title)}</span>${starBtn(regm(it))}</div>`;
const sceneThumbs = sc => sc.pending ? '<div class="spin">Ищу кадры…</div>' : (sc.items.length ? sc.items.map((it, i) => thumbHTML(it, i, sc.n)).join('') : '<p class="err">Ничего не нашлось. Нажми на запрос выше и поищи вручную.</p>');
function paintScene(n) { const el = document.querySelector(`#scn-${n} .hs`); if (el) el.innerHTML = sceneThumbs(scenes[n]); }
function paintBroll() {
  lastMode = 'broll';
  const out = $('#scriptout');
  if (!out) return;
  out.innerHTML = `<div class="lbar" style="margin-top:14px"><button type="button" data-do="copyq">Скопировать запросы</button></div>` + scenes.map(sc =>
    `<section class="card scn" id="scn-${sc.n}"><div class="sh"><span class="ico" style="--t:#ef6a3c">${sc.n + 1}</span><h2>${esc(sc.title || 'Сцена ' + (sc.n + 1))}</h2></div>
    <p class="err" style="margin:6px 0 0">${esc(sc.excerpt)}${sc.mood ? ' · ' + esc(sc.mood) : ''}</p>
    <div class="recent" style="margin:8px 0">${sc.queries.map(q => `<button type="button" data-do="qgo" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="hs">${sceneThumbs(sc)}</div></section>`).join('');
}
async function runBroll() {
  if (!cfg.worker) return needWorker();
  const text = scriptText.trim();
  if (text.length < 40) return toast('Вставь текст сценария');
  const out = $('#scriptout'), my = ++ssid;
  out.innerHTML = '<div class="spin">Разбираю сценарий на сцены…</div>';
  let list;
  try { list = (await api('broll', { script: text.slice(0, 12000) })).scenes || []; }
  catch (e) { if (my === ssid) out.innerHTML = errCard(e); return; }
  if (my !== ssid) return;
  const kind = brollKind;
  const srcs = SOURCES[kind].filter(s => !(s.key && !cfg[s.key]) && !cfg.off[s.id]);
  if (!srcs.length) { out.innerHTML = '<div class="card"><p class="note">Включи источники на вкладке «Видео» или «Картинки» либо добавь ключи в настройках.</p></div>'; return; }
  scenes = list.map((s, i) => Object.assign({}, s, { n: i, items: [], pending: true }));
  paintBroll();
  await pool(scenes, 2, async sc => {
    const lists = await Promise.all(srcs.map(async s => {
      const arr = [];
      for (const qq of sc.queries.slice(0, 2)) { try { arr.push(...await s.run(qq, qq)); } catch (e) {} }
      return arr;
    }));
    const seen = new Set(), items = [];
    for (let i = 0; items.length < 10 && lists.some(l => i < l.length); i++) {
      lists.forEach(l => { const it = l[i], k = it && (it.page || it.full || it.embed); if (it && !seen.has(k) && items.length < 10) { seen.add(k); items.push(it); } });
    }
    sc.items = items; sc.pending = false;
    if (my === ssid) paintScene(sc.n);
  });
}

/* ---------- Подписки на свежие мета-анализы ---------- */
const renderSubs = list => { $('#subs').innerHTML = list.length ? list.map(t => `<div class="subrow"><span>${esc(t.ru)}</span><button type="button" data-us="${esc(t.id)}" aria-label="Отписаться">✕</button></div>`).join('') : '<div class="help">Подписок пока нет.</div>'; };
async function loadSubs() {
  const box = $('#subs');
  if (!cfg.worker) { box.innerHTML = '<div class="help">Сначала укажи адрес Worker и сохрани.</div>'; return; }
  box.innerHTML = '<div class="help">Загружаю…</div>';
  try { renderSubs((await api('subs', null, 'GET')).subs || []); } catch (e) { box.innerHTML = `<div class="help">${esc(e.message)}</div>`; }
}

function doAction(el) {
  const a = el.dataset.do;
  if (a === 'tr') return doTranslate();
  if (a === 'cons') return runConsensus();
  if (a === 'fact') return runFact();
  if (a === 'broll') return runBroll();
  if (a === 'bk') { brollKind = el.dataset.v; return renderScript(); }
  if (a === 'copyq') return copyText(scenes.map((s, i) => `${i + 1}. ${s.title}: ${s.queries.join(' | ')}`).join('\n'), 'Запросы скопированы');
  if (a === 'qgo') {
    tab = brollKind; sid++;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab ? 'true' : 'false'));
    $('#q').value = el.dataset.q; renderChips(); search(el.dataset.q);
  }
}

/* ---------- Просмотр ---------- */
async function openViewer(it) {
  const tok = ++vtok, st = $('#stage');
  viewerItem = it;
  $('#cap').innerHTML = `${esc(it.title)}<small>${esc(it.meta || '')}${it.lic ? ' · ' + esc(it.lic) : ''}</small>`;
  $('#src').href = it.page || '#';
  $('#viewer').classList.add('open');
  if (it.type === 'image') {
    st.innerHTML = `<img id="vimg" src="${safe(it.full)}" alt="">`;
    $('#vimg').onerror = function () { this.onerror = null; this.src = it.thumb; };
  } else if (it.type === 'embed') {
    st.innerHTML = `<iframe src="${safe(it.embed)}" allowfullscreen></iframe>`;
  } else {
    st.innerHTML = '<div class="spin white">Загружаю видео…</div>';
    let url = it.full;
    try { if (!url && it.asset) url = await resolveVideo(it); } catch (e) {}
    if (tok !== vtok) return;
    st.innerHTML = url ? `<video src="${safe(url)}" poster="${safe(it.thumb)}" controls autoplay playsinline></video>` : '<p class="note white">Не удалось получить файл. Открой источник.</p>';
  }
}
function closeViewer() { vtok++; $('#viewer').classList.remove('open'); $('#stage').innerHTML = ''; }

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1600); }
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (_) {} a.remove(); }
  toast(msg || 'Источник скопирован');
}

/* ---------- Настройки ---------- */
function openSheet() {
  $('#lang').value = cfg.lang; $('#k-pexels').value = cfg.pexels; $('#k-pixabay').value = cfg.pixabay; $('#sites').value = cfg.sites; $('#k-worker').value = cfg.worker || ''; $('#k-token').value = cfg.token || '';
  $('#sheet').classList.add('open'); loadSubs();
}

/* ---------- События ---------- */
$('#form').addEventListener('submit', e => { e.preventDefault(); search($('#q').value); });
$('#enform').addEventListener('submit', e => { e.preventDefault(); search($('#q').value, $('#qen').value); });
$('#gear').addEventListener('click', openSheet);
$('#vclose').addEventListener('click', closeViewer);
$('#vcopy').addEventListener('click', () => { const it = viewerItem; if (it) copyText(`${it.title}. ${it.meta}.${it.lic ? ' Лицензия: ' + it.lic + '.' : ''} ${it.page || ''}`); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.classList.remove('open'); });
$('#sites-reset').addEventListener('click', () => { $('#sites').value = DEFAULT_SITES; });
$('#save').addEventListener('click', () => {
  cfg.lang = $('#lang').value; cfg.pexels = $('#k-pexels').value.trim(); cfg.pixabay = $('#k-pixabay').value.trim();
  cfg.sites = $('#sites').value.trim() || DEFAULT_SITES; cfg.worker = $('#k-worker').value.trim(); cfg.token = $('#k-token').value.trim();
  store.set('cfg', cfg); $('#sheet').classList.remove('open'); renderChips();
  if ($('#q').value.trim()) search($('#q').value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); $('#sheet').classList.remove('open'); } });

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; sid++;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  renderChips();
  if (tab === 'script') return renderScript();
  if ($('#q').value.trim()) search($('#q').value, $('#enform').hidden ? '' : $('#qen').value); else renderHome();
});

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.t) { cfg[b.dataset.t] = !cfg[b.dataset.t]; }
  else {
    const s = SOURCES[tab].find(x => x.id === b.dataset.id);
    if (s.key && !cfg[s.key]) { openSheet(); return; }
    cfg.off[s.id] = !cfg.off[s.id];
  }
  store.set('cfg', cfg); renderChips();
  if ($('#q').value.trim()) search($('#q').value, $('#enform').hidden ? '' : $('#qen').value);
});

$('#results').addEventListener('click', e => {
  const st = e.target.closest('.star'); if (st) return toggleStar(st.dataset.k);
  const dd = e.target.closest('[data-do]'); if (dd) return doAction(dd);
  const mk = e.target.closest('.mk'); if (mk) return jumpClaim(mk.dataset.cl);
  const la = e.target.closest('[data-la]'); if (la) return libAction(la);
  const m = e.target.closest('.m'); if (m) return openViewer(m.dataset.sc != null ? scenes[+m.dataset.sc].items[+m.dataset.i] : current[+m.dataset.i]);
  const r = e.target.closest('[data-r]'); if (r) { $('#q').value = r.dataset.r; search(r.dataset.r); return; }
  const sc = e.target.closest('.sc');
  if (sc) {
    cfg.sitesOff[sc.dataset.d] = !cfg.sitesOff[sc.dataset.d];
    store.set('cfg', cfg);
    $('#sites').outerHTML = sitesHTML();
  }
});

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-ext]');
  if (!a || a.getAttribute('href') === '#') return;
  e.preventDefault(); openLink(a.href);
});

$('#libbtn').addEventListener('click', () => { tab = 'lib'; sid++; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', 'false')); renderChips(); renderLib(); });
$('#savesheet').addEventListener('click', e => { if (e.target.id === 'savesheet') e.currentTarget.classList.remove('open'); const c = e.target.closest('[data-c]'); if (c) addTo(c.dataset.c); });
$('#addcol').addEventListener('click', () => { const n = $('#newcol').value.trim(); if (!n) return; const id = 'c' + Date.now(); lib.cols.push({ id, n }); $('#newcol').value = ''; addTo(id); });
$('#results').addEventListener('input', e => { if (e.target.id === 'script') { scriptText = e.target.value; store.set('script', scriptText); } });
$('#addsub').addEventListener('click', async () => {
  const t = $('#newsub').value.trim(); if (!t) return;
  try { renderSubs((await api('subs', { topic: t })).subs || []); $('#newsub').value = ''; toast('Подписка добавлена'); } catch (e) { toast(e.message === 'NO_WORKER' ? 'Сначала укажи Worker' : e.message); }
});
$('#subs').addEventListener('click', async e => {
  const b = e.target.closest('[data-us]'); if (!b) return;
  try { renderSubs((await api('subs', { id: b.dataset.us }, 'DELETE')).subs || []); } catch (x) { toast(x.message); }
});
restoreLib();
renderChips();
renderHome();
</script>
</body>
</html>
