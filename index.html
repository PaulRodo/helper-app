<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Поиск</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #1c1c1e);
  --hint: var(--tg-theme-hint-color, #8a8a8e);
  --link: var(--tg-theme-link-color, #2481cc);
  --accent: var(--tg-theme-button-color, #2481cc);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --sec: var(--tg-theme-secondary-bg-color, #f1f1f4);
  --line: color-mix(in srgb, var(--hint) 25%, transparent);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
form { display: flex; gap: 8px; }
.field { flex: 1; display: flex; align-items: center; background: var(--sec); border-radius: 12px; padding: 0 12px; }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 11px 0; outline: none; font-size: 16px; }
.field input::placeholder { color: var(--hint); }
.go { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 0 16px; font-weight: 600; }
.gear { width: 44px; border-radius: 12px; background: var(--sec); font-size: 18px; }

.tabs { display: flex; gap: 4px; margin-top: 10px; background: var(--sec); padding: 3px; border-radius: 11px; }
.tabs button { flex: 1; padding: 7px 0; border-radius: 9px; color: var(--hint); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--hint); font-size: 14px; }
.chip.on { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); color: var(--text); }
.chip.lock { border-style: dashed; }

main { padding: 6px 14px 40px; }
.note, .spin { color: var(--hint); padding: 18px 2px; text-align: center; }
.err { color: var(--hint); font-size: 14px; padding: 4px 0 10px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.recent button { background: var(--sec); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

section h2 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
.card { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.card img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--sec); }
.card b { display: block; font-weight: 600; }
.card p { margin: 2px 0 0; color: var(--hint); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card small { color: var(--link); font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding-top: 10px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.m { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sec); padding: 0; }
.m img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 12px; line-height: 1.25; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.65)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.m .play { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; display: grid; place-items: center; font-style: normal; }

.links { padding: 18px 0 4px; color: var(--hint); font-size: 14px; }
.links a { color: var(--link); margin-right: 12px; white-space: nowrap; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.88); display: none; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.overlay.open { display: flex; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.stage img, .stage video { max-width: 100%; max-height: 100%; border-radius: 8px; }
.stage iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 8px; }
.cap { color: #fff; padding: 10px 2px 8px; font-size: 14px; }
.cap small { display: block; opacity: .65; margin-top: 2px; }
.acts { display: flex; gap: 8px; }
.acts a, .acts button { flex: 1; text-align: center; padding: 11px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
.acts button { background: rgba(255,255,255,.16); color: #fff; }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: none; align-items: flex-end; }
.sheet.open { display: flex; }
.panel { width: 100%; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); }
.panel h3 { margin: 0 0 4px; font-size: 18px; }
.panel label { display: block; margin-top: 14px; font-weight: 500; }
.panel input, .panel select { width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sec); }
.panel .help { color: var(--hint); font-size: 13px; margin-top: 4px; }
.panel .help a { color: var(--link); }
.panel .save { width: 100%; margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .overlay.open, .sheet.open { animation: fade .15s ease-out; } @keyframes fade { from { opacity: 0; } } }
</style>
</head>
<body>

<header>
  <form id="form" autocomplete="off">
    <label class="field">
      <input id="q" type="search" enterkeyhint="search" placeholder="Что найти?" aria-label="Запрос">
    </label>
    <button class="go" type="submit">Найти</button>
    <button class="gear" type="button" id="gear" aria-label="Настройки">⚙️</button>
  </form>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="info" aria-selected="true">Статьи</button>
    <button role="tab" data-tab="image" aria-selected="false">Картинки</button>
    <button role="tab" data-tab="video" aria-selected="false">Видео</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="results"></main>

<div class="overlay" id="viewer" role="dialog" aria-modal="true">
  <div class="stage" id="stage"></div>
  <div class="cap" id="cap"></div>
  <div class="acts"><a id="src" data-ext href="#">Открыть источник</a><button type="button" id="vclose">Закрыть</button></div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>Настройки</h3>
    <div class="help">Ключи хранятся только на этом устройстве.</div>
    <label>Язык статей и подсказок
      <select id="lang">
        <option value="ru">Русский</option><option value="en">English</option>
        <option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option>
      </select>
    </label>
    <label>Ключ Pixabay (картинки и видео)
      <input id="k-pixabay" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Вставь ключ">
      <div class="help">Бесплатно: <a data-ext href="https://pixabay.com/api/docs/">pixabay.com/api/docs</a></div>
    </label>
    <label>Ключ YouTube Data API v3
      <input id="k-youtube" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Вставь ключ">
      <div class="help">Создаётся в <a data-ext href="https://console.cloud.google.com/apis/library/youtube.googleapis.com">Google Cloud</a>, есть бесплатная квота.</div>
    </label>
    <button class="save" type="button" id="save">Сохранить</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let cfg = Object.assign({ pixabay: '', youtube: '', lang: 'ru', off: {} }, store.get('cfg', {}));
let recent = store.get('recent', []);
let tab = 'info', sid = 0, current = [];

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const strip = h => new DOMParser().parseFromString(String(h || ''), 'text/html').body.textContent || '';
const enc = encodeURIComponent;
const openLink = url => (tg && tg.openLink) ? tg.openLink(url) : window.open(url, '_blank');

async function getJSON(url) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 12000);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- Источники ---------- */
const commons = (q, filter, type) => getJSON(
  `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${enc(q + ' ' + filter)}&gsrlimit=24&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*`
).then(d => Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).map(p => {
  const i = (p.imageinfo || [])[0] || {};
  return { type, thumb: i.thumburl || i.url, full: i.url, title: p.title.replace(/^File:/, '').replace(/\.\w+$/, ''), page: i.descriptionurl, meta: 'Wikimedia Commons' };
}).filter(x => x.thumb));

const pbLang = () => cfg.lang;

const SOURCES = {
  info: [
    { id: 'wiki', label: 'Википедия', run: async q => {
      const l = cfg.lang;
      const d = await getJSON(`https://${l}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q)}&gsrlimit=6&prop=extracts|pageimages&exintro=1&explaintext=1&exsentences=3&piprop=thumbnail&pithumbsize=160&format=json&origin=*`);
      return Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index).map(p => ({
        title: p.title, text: p.extract, thumb: p.thumbnail && p.thumbnail.source, url: `https://${l}.wikipedia.org/?curid=${p.pageid}`, meta: `${l}.wikipedia.org`
      }));
    } },
    { id: 'hn', label: 'Hacker News', run: async q => {
      const d = await getJSON(`https://hn.algolia.com/api/v1/search?query=${enc(q)}&tags=story&hitsPerPage=6`);
      return d.hits.filter(h => h.title).map(h => ({
        title: h.title, text: `${h.points || 0} очков, ${h.num_comments || 0} комментариев`, url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`, meta: h.url ? new URL(h.url).hostname : 'news.ycombinator.com'
      }));
    } },
    { id: 'so', label: 'Stack Overflow', run: async q => {
      const d = await getJSON(`https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${enc(q)}&site=stackoverflow&pagesize=6`);
      return d.items.map(i => ({ title: strip(i.title), text: `${i.score} голосов, ответов: ${i.answer_count}`, url: i.link, meta: 'stackoverflow.com' }));
    } },
    { id: 'books', label: 'Книги', run: async q => {
      const d = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${enc(q)}&maxResults=6&langRestrict=${cfg.lang}`);
      return (d.items || []).map(i => {
        const v = i.volumeInfo || {};
        return { title: v.title, text: [(v.authors || []).join(', '), v.description].filter(Boolean).join(' — '), thumb: v.imageLinks && v.imageLinks.thumbnail && v.imageLinks.thumbnail.replace('http://', 'https://'), url: v.infoLink, meta: 'Google Books' };
      });
    } }
  ],
  image: [
    { id: 'openverse', label: 'Openverse', run: async q => {
      const d = await getJSON(`https://api.openverse.org/v1/images/?q=${enc(q)}&page_size=24`);
      return d.results.map(r => ({ type: 'image', thumb: r.thumbnail || r.url, full: r.url, title: r.title || 'Без названия', page: r.foreign_landing_url, meta: `Openverse, лицензия ${(r.license || '').toUpperCase()}${r.creator ? ', ' + r.creator : ''}` }));
    } },
    { id: 'commons', label: 'Wikimedia', run: q => commons(q, 'filetype:bitmap', 'image') },
    { id: 'pixabay', label: 'Pixabay', key: 'pixabay', run: async q => {
      const d = await getJSON(`https://pixabay.com/api/?key=${enc(cfg.pixabay)}&q=${enc(q)}&per_page=24&safesearch=true&lang=${pbLang()}`);
      return d.hits.map(h => ({ type: 'image', thumb: h.webformatURL, full: h.largeImageURL, title: h.tags, page: h.pageURL, meta: 'Pixabay, ' + h.user }));
    } }
  ],
  video: [
    { id: 'cvideo', label: 'Wikimedia', run: q => commons(q, 'filetype:video', 'video') },
    { id: 'pxvideo', label: 'Pixabay', key: 'pixabay', run: async q => {
      const d = await getJSON(`https://pixabay.com/api/videos/?key=${enc(cfg.pixabay)}&q=${enc(q)}&per_page=18&safesearch=true&lang=${pbLang()}`);
      return d.hits.map(h => {
        const v = h.videos || {};
        const f = (v.medium && v.medium.url) || (v.small && v.small.url) || (v.tiny && v.tiny.url);
        return { type: 'video', thumb: `https://i.vimeocdn.com/video/${h.picture_id}_640x360.jpg`, full: f, title: h.tags, page: h.pageURL, meta: 'Pixabay, ' + h.user };
      }).filter(x => x.full);
    } },
    { id: 'yt', label: 'YouTube', key: 'youtube', run: async q => {
      const d = await getJSON(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${enc(q)}&key=${enc(cfg.youtube)}`);
      return d.items.map(i => ({ type: 'yt', id: i.id.videoId, thumb: i.snippet.thumbnails.medium.url, title: strip(i.snippet.title), page: `https://www.youtube.com/watch?v=${i.id.videoId}`, meta: 'YouTube, ' + i.snippet.channelTitle }));
    } }
  ]
};

const LINKS = {
  info: [['Google', q => `https://www.google.com/search?q=${enc(q)}`], ['Яндекс', q => `https://yandex.ru/search/?text=${enc(q)}`], ['DuckDuckGo', q => `https://duckduckgo.com/?q=${enc(q)}`]],
  image: [['Google Картинки', q => `https://www.google.com/search?tbm=isch&q=${enc(q)}`], ['Яндекс Картинки', q => `https://yandex.ru/images/search?text=${enc(q)}`], ['Pinterest', q => `https://www.pinterest.com/search/pins/?q=${enc(q)}`]],
  video: [['YouTube', q => `https://www.youtube.com/results?search_query=${enc(q)}`], ['Rutube', q => `https://rutube.ru/search/?query=${enc(q)}`], ['Vimeo', q => `https://vimeo.com/search?q=${enc(q)}`]]
};

/* ---------- Интерфейс ---------- */
function renderChips() {
  $('#chips').innerHTML = SOURCES[tab].map(s => {
    const locked = s.key && !cfg[s.key];
    const on = !locked && !cfg.off[s.id];
    return `<button type="button" class="chip ${on ? 'on' : ''} ${locked ? 'lock' : ''}" data-id="${s.id}" title="${locked ? 'Нужен ключ в настройках' : ''}">${locked ? '🔒 ' : ''}${s.label}</button>`;
  }).join('');
}

function renderHome() {
  const hint = { info: 'Введи тему, и я соберу статьи, обсуждения и книги.', image: 'Опиши, какая картинка нужна.', video: 'Опиши, какое видео ищешь.' }[tab];
  $('#results').innerHTML = `<p class="note">${hint}</p>` + (recent.length ? `<div class="recent">${recent.map(r => `<button type="button" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>` : '');
}

function linksBlock(q) {
  return `<div class="links">Искать ещё: ${LINKS[tab].map(([n, f]) => `<a data-ext href="${esc(f(q))}">${n}</a>`).join('')}</div>`;
}

function cardHTML(it) {
  return `<a class="card" data-ext href="${safe(it.url)}">${it.thumb ? `<img loading="lazy" src="${safe(it.thumb)}" alt="">` : ''}<div><b>${esc(it.title)}</b>${it.text ? `<p>${esc(it.text)}</p>` : ''}<small>${esc(it.meta || '')}</small></div></a>`;
}

function renderMedia(q, pending, errs) {
  const res = $('#results');
  let html = '';
  if (current.length) {
    html += `<div class="grid">${current.map((it, i) => `<button type="button" class="m" data-i="${i}"><img loading="lazy" src="${safe(it.thumb)}" alt=""><span>${esc(it.title)}</span>${it.type !== 'image' ? '<i class="play">▶</i>' : ''}</button>`).join('')}</div>`;
  }
  if (pending > 0) html += `<div class="spin">Ищу ещё…</div>`;
  else if (!current.length) html += `<p class="note">Ничего не нашлось. Попробуй другие слова или включи другой источник.</p>`;
  if (errs.length && pending === 0) html += `<p class="err">Не ответили: ${errs.join(', ')}.</p>`;
  if (pending === 0) html += linksBlock(q);
  res.innerHTML = html;
}

async function search(q) {
  q = q.trim();
  if (!q) return;
  recent = [q, ...recent.filter(r => r !== q)].slice(0, 8);
  store.set('recent', recent);
  $('#q').blur();
  const id = ++sid;
  current = [];
  const srcs = SOURCES[tab].filter(s => !(s.key && !cfg[s.key]) && !cfg.off[s.id]);
  const res = $('#results');
  if (!srcs.length) { res.innerHTML = '<p class="note">Включи хотя бы один источник.</p>'; return; }

  if (tab === 'info') {
    res.innerHTML = srcs.map(s => `<section id="sec-${s.id}"><h2>${s.label}</h2><div class="spin">Загружаю…</div></section>`).join('') + linksBlock(q);
    srcs.forEach(async s => {
      let html;
      try {
        const items = (await s.run(q)).filter(x => x.title);
        html = items.length ? items.map(cardHTML).join('') : '<p class="err">Ничего не нашлось.</p>';
      } catch (e) { html = '<p class="err">Источник не ответил. Попробуй ещё раз позже.</p>'; }
      if (id !== sid) return;
      const sec = document.getElementById('sec-' + s.id);
      if (sec) sec.innerHTML = `<h2>${s.label}</h2>${html}`;
    });
  } else {
    let pending = srcs.length; const errs = [];
    res.innerHTML = '<div class="spin">Ищу…</div>';
    srcs.forEach(async s => {
      try { const items = await s.run(q); if (id === sid) current.push(...items); }
      catch (e) { errs.push(s.label); }
      if (id !== sid) return;
      pending--;
      renderMedia(q, pending, errs);
    });
  }
}

/* ---------- Просмотр ---------- */
function openViewer(it) {
  const st = $('#stage');
  if (it.type === 'image') st.innerHTML = `<img src="${safe(it.full)}" alt="${esc(it.title)}">`;
  else if (it.type === 'yt') st.innerHTML = `<iframe src="https://www.youtube.com/embed/${enc(it.id)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  else st.innerHTML = `<video src="${safe(it.full)}" poster="${safe(it.thumb)}" controls autoplay playsinline></video>`;
  $('#cap').innerHTML = `${esc(it.title)}<small>${esc(it.meta || '')}</small>`;
  $('#src').href = it.page || it.full || '#';
  $('#viewer').classList.add('open');
}
function closeViewer() { $('#viewer').classList.remove('open'); $('#stage').innerHTML = ''; }

/* ---------- Настройки ---------- */
function openSheet() {
  $('#lang').value = cfg.lang; $('#k-pixabay').value = cfg.pixabay; $('#k-youtube').value = cfg.youtube;
  $('#sheet').classList.add('open');
}

/* ---------- События ---------- */
$('#form').addEventListener('submit', e => { e.preventDefault(); search($('#q').value); });
$('#gear').addEventListener('click', openSheet);
$('#vclose').addEventListener('click', closeViewer);
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.classList.remove('open'); });
$('#save').addEventListener('click', () => {
  cfg.lang = $('#lang').value; cfg.pixabay = $('#k-pixabay').value.trim(); cfg.youtube = $('#k-youtube').value.trim();
  store.set('cfg', cfg); $('#sheet').classList.remove('open'); renderChips();
  if ($('#q').value.trim()) search($('#q').value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); $('#sheet').classList.remove('open'); } });

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; sid++;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  renderChips();
  $('#q').value.trim() ? search($('#q').value) : renderHome();
});

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const s = SOURCES[tab].find(x => x.id === b.dataset.id);
  if (s.key && !cfg[s.key]) { openSheet(); return; }
  cfg.off[s.id] = !cfg.off[s.id]; store.set('cfg', cfg); renderChips();
  if ($('#q').value.trim()) search($('#q').value);
});

$('#results').addEventListener('click', e => {
  const m = e.target.closest('.m'); if (m) return openViewer(current[+m.dataset.i]);
  const r = e.target.closest('[data-r]'); if (r) { $('#q').value = r.dataset.r; search(r.dataset.r); }
});

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-ext]');
  if (!a || a.getAttribute('href') === '#') return;
  e.preventDefault(); openLink(a.href);
});

renderChips();
renderHome();
</script>
</body>
</html>
